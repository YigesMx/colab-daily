# Formal daily site deployment.
#
# Bounded published history (owner-approved 2026-11-09): the production deploy
# (`python -m colab_daily.publication deploy`) already keeps this repository's
# committed preview images under COLAB_SITE_IMAGE_BUDGET_MB (default 800 MB) by
# replacing the oldest prior days' `docs/public/daily/*/assets/*/preview.*` with
# tiny same-format placeholders in the same managed commit. This workflow only
# builds and publishes the already-bounded tree, keeping the uploaded artifact
# below the GitHub Pages 1 GB deployment ceiling; history pages keep their
# image references (placeholders render in place of archived previews).
name: Deploy formal daily site
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}/
      - run: node scripts/artifact-manifest.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
        with:
          # Headroom for near-budget artifacts; first observed 10-min default
          # timeout aborting a 1.12 GB deployment on 2026-11-05.
          timeout: 15
