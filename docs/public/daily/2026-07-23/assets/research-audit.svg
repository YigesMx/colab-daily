<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Research evidence audit diagram</title>
  <desc id="desc">A local sample diagram connecting claims, evidence, review, and follow-up research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="#60a5fa" stroke-width="6" opacity=".7">
    <path d="M290 338h175M735 338h175"/>
    <path d="M600 228v-78M600 448v78"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="32" font-weight="700" text-anchor="middle">
    <rect x="90" y="270" width="200" height="136" rx="20" fill="#1e3a5f" stroke="#60a5fa"/>
    <text x="190" y="350" fill="#dbeafe">CLAIMS</text>
    <rect x="465" y="228" width="270" height="220" rx="28" fill="#0f766e" stroke="#5eead4"/>
    <text x="600" y="326" fill="#ccfbf1">EVIDENCE</text>
    <text x="600" y="369" fill="#ccfbf1">AUDIT</text>
    <rect x="910" y="270" width="200" height="136" rx="20" fill="#3f2d16" stroke="#fbbf24"/>
    <text x="1010" y="350" fill="#fef3c7">REVIEW</text>
    <rect x="480" y="42" width="240" height="108" rx="18" fill="#1f2937" stroke="#64748b"/>
    <text x="600" y="108" fill="#e2e8f0">SOURCES</text>
    <rect x="450" y="526" width="300" height="108" rx="18" fill="#1f2937" stroke="#64748b"/>
    <text x="600" y="592" fill="#e2e8f0">FOLLOW-UP</text>
  </g>
</svg>
